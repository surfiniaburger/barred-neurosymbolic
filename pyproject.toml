[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "barred-neurosymbolic"
version = "0.1.0"
description = "Deterministic Acceptance Boundaries & AST-Guided GEPA for Autonomous AI Security Swarms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Adedoyinsola Ogungbesan" }
]
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-c>=0.21.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
